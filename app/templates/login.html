{% extends "base.html" %}
{% block title %}Login  Teams{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto">
  <h1 class="text-[15px] font-semibold mb-6 text-center">Welcome back</h1>
  <form id="login-form" class="card rounded-2xl p-6 space-y-4">
    <div>
      <label class="block text-[13px] font-medium muted mb-1">Email or phone</label>
      <input type="text" name="identifier" required autocomplete="username"
             class="w-full px-3 py-2.5 rounded-lg card border focus:outline-none focus:ring-2 focus:ring-[var(--accent)]" />
    </div>
    <div>
      <label class="block text-[13px] font-medium muted mb-1">Password</label>
      <div class="relative">
        <input type="password" id="login-pass" name="password" required autocomplete="current-password"
               class="w-full px-3 py-2.5 pr-10 rounded-lg card border focus:outline-none focus:ring-2 focus:ring-[var(--accent)]" />
        <button type="button" data-eye="login-pass" class="eye-btn absolute right-2.5 top-1/2 -translate-y-1/2 p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="w-full btn py-2.5 rounded-lg bg-[var(--accent)] text-white font-medium">Log in</button>
    <p id="login-msg" class="text-[13px] text-center muted"></p>
    <p class="text-[13px] text-center muted">
      <a href="/forgot" class="accent hover:underline">Forgot password?</a>
      · <a href="/signup" class="accent hover:underline">Sign up</a>
    </p>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('login-msg');
  msg.textContent = '&';
  const fd = new FormData(e.target);
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier: fd.get('identifier'), password: fd.get('password') })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Login failed');
    window.location.href = '/dashboard';
  } catch (err) {
    msg.textContent = err.message;
  }
});
</script>
{% endblock %}
