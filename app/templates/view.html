<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>{{ page_title }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #1a1a1a; }
    .viewer {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #e5e5e5;
      font-family: system-ui, -apple-system, sans-serif;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
    }
    .fallback a {
      color: #5C5DE2;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border: 1px solid #5C5DE2;
      border-radius: 0.5rem;
    }
    .fallback a:hover { background: #5C5DE2; color: white; }
  </style>
</head>
<body>
  {% if is_embeddable %}
  <iframe
    class="viewer"
    src="{{ content_url }}"
    title="{{ page_title }}"
    allowfullscreen
  ></iframe>
  {% else %}
  <div class="fallback">
    <p>This file type cannot be previewed inline.</p>
    <a href="{{ content_url }}" target="_blank" rel="noopener">Open / Download</a>
  </div>
  {% endif %}
</body>
</html>
