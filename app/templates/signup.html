{% extends "base.html" %}
{% block title %}Sign up - Teams{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto">
  <h1 class="text-[15px] font-semibold mb-6 text-center">Create account</h1>
  <form id="signup-form" class="card rounded-2xl p-6 space-y-4">
    <div>
      <label class="block text-[13px] font-medium muted mb-1">Full name</label>
      <input type="text" name="full_name" required minlength="2"
             class="w-full px-3 py-2.5 rounded-lg card border focus:outline-none focus:ring-2 focus:ring-[var(--accent)]" />
    </div>
    <div>
      <label class="block text-[13px] font-medium muted mb-1">Username</label>
      <input type="text" name="username" required minlength="3" maxlength="64"
             pattern="[a-zA-Z0-9][a-zA-Z0-9_-]{2,62}"
             title="3–63 characters: letters, numbers, underscore or hyphen; must start with a letter or number"
             autocomplete="username"
             class="w-full px-3 py-2.5 rounded-lg card border focus:outline-none focus:ring-2 focus:ring-[var(--accent)]" />
      <p class="text-[11px] muted mt-1">3–63 chars · a-z, 0-9, _ or - · starts with letter/number</p>
    </div>
    <div>
      <label class="block text-[13px] font-medium muted mb-1">Email</label>
      <input type="email" name="email" required
             class="w-full px-3 py-2.5 rounded-lg card border focus:outline-none focus:ring-2 focus:ring-[var(--accent)]" />
    </div>
    <div>
      <label class="block text-[13px] font-medium muted mb-1">Phone number</label>
      <input type="tel" name="phone" required
             class="w-full px-3 py-2.5 rounded-lg card border focus:outline-none focus:ring-2 focus:ring-[var(--accent)]" />
    </div>
    <div>
      <label class="block text-[13px] font-medium muted mb-1">Password (min 6)</label>
      <div class="relative">
        <input type="password" id="signup-pass" name="password" required minlength="6"
               class="w-full px-3 py-2.5 pr-10 rounded-lg card border focus:outline-none focus:ring-2 focus:ring-[var(--accent)]" />
        <button type="button" data-eye="signup-pass" class="eye-btn absolute right-2.5 top-1/2 -translate-y-1/2 p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="w-full btn btn-primary py-2.5 rounded-lg font-medium">Create account</button>
    <p id="signup-msg" class="text-[13px] text-center muted"></p>
    <p class="text-[13px] text-center muted">Already have an account? <a href="/login" class="accent hover:underline">Log in</a></p>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('signup-msg');
  msg.textContent = 'Loading...';
  const fd = new FormData(e.target);
  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        full_name: fd.get('full_name'),
        username: fd.get('username'),
        email: fd.get('email'),
        phone: fd.get('phone'),
        password: fd.get('password')
      })
    });
    const data = await res.json();
    if (!res.ok) {
      const detail = data.detail;
      // Pydantic validation errors come as a list
      if (Array.isArray(detail)) {
        throw new Error(detail.map(d => d.msg || JSON.stringify(d)).join('; '));
      }
      throw new Error(detail || 'Signup failed');
    }
    window.location.href = '/dashboard';
  } catch (err) {
    msg.textContent = err.message;
  }
});
</script>
{% endblock %}
